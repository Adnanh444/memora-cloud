name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Verify source and contrast contracts
        run: |
          python3 tools/verify_contracts.py
          python3 tools/verify_dark_contrast.py
          python3 tools/check_integrity.py
      - name: Test and build with the existing release key
        run: |
          if [ ! -s "${KEYSTORE_FILE:-}" ]; then
            echo "::error::Existing release signing key is missing. Restore its Secrets; do not generate a replacement key."
            exit 1
          fi
          gradle testDebugUnitTest assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Check APK and write download checksum
        run: |
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            test -s "$apk"
            unzip -t "$apk" > /dev/null
            sha256sum "$apk" > "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: memora-apk-0.9.5
          compression-level: 0
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
