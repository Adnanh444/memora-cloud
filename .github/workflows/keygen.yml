name: Create signing key
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate key and save it as secrets
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          set -e
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q KEYSTORE_B64; then
            echo "A signing key already exists. Stopping so it is not overwritten."
            exit 1
          fi
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.jks -alias memora \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Adnan, O=Memora Cloud, C=BD"
          base64 -w0 release.jks > ks.b64
          gh secret set KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" < ks.b64
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "memora"
          rm -f release.jks ks.b64
          echo "Signing key created and saved as secrets."
